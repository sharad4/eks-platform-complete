# One cluster-wide connection from External Secrets to AWS Secrets Manager.
#
# There is deliberately NO credentials block: the ESO controller authenticates
# with its own IRSA role (created by Terraform, scoped to read only this
# cluster's secrets). Nothing secret is stored here, so this file is safe in Git.
#
# Applied by ArgoCD in Phase 4, AFTER the ESO CRDs exist (sync-wave 1).
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
