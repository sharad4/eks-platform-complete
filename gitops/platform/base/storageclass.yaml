# gp3: ~20% cheaper than the default gp2 and with decoupled IOPS/throughput.
# NOT marked default (EKS already ships a default gp2 class and two defaults
# conflict), so workloads that need it say storageClassName: gp3 explicitly.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
volumeBindingMode: WaitForFirstConsumer   # create the volume in the AZ where the pod lands
allowVolumeExpansion: true
reclaimPolicy: Delete
