# Part of the baseline guardrails. Pod Security Admission handles pod hardening;
# this policy covers an organisation rule PSA cannot express.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-default-serviceaccount
  annotations:
    policies.kyverno.io/title: Disallow the default service account
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Every workload needs its own ServiceAccount so permissions (and IRSA roles) can be granted per workload.
spec:
  validationFailureAction: Enforce      # switch to Audit to trial a new rule without blocking anyone
  background: true                      # also report on workloads that already exist
  rules:
    - name: no-default-sa
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [dev, staging, production]
      validate:
        message: "Pods must not use the 'default' ServiceAccount."
        pattern:
          spec:
            serviceAccountName: "!default"
