{{- if .Values.rollout.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  workloadRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "app.fullname" . }}
    scaleDown: progressively
  strategy:
    canary:
      maxSurge: {{ .Values.rollout.maxSurge }}
      maxUnavailable: {{ .Values.rollout.maxUnavailable }}
      {{- if .Values.rollout.analysis.enabled }}
      # Background analysis runs for the whole rollout; a failure aborts it and
      # shifts traffic back to the stable ReplicaSet automatically.
      analysis:
        templates:
          - templateName: {{ include "app.fullname" . }}-success-rate
        startingStep: 1
        args:
          - name: namespace
            value: {{ .Release.Namespace }}
          - name: service
            value: {{ include "app.fullname" . }}
      {{- end }}
      steps:
        {{- toYaml .Values.rollout.steps | nindent 8 }}
{{- end }}
