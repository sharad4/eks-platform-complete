apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps-lite
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Lite workloads. Same guard rails as the full edition.
  sourceRepos:
    - https://github.com/sharad4/eks-platform.git
  destinations:
    - { server: https://kubernetes.default.svc, namespace: lite }
  clusterResourceWhitelist: []
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-lite
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Databases and optional tooling
  sourceRepos: ["*"]
  destinations:
    - { server: https://kubernetes.default.svc, namespace: "*" }
  clusterResourceWhitelist:
    - { group: "*", kind: "*" }
