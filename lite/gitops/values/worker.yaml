# Environment layer. CI edits ONLY image.tag (lite/.github workflow: ci-lite.yaml).
image:
  repository: ghcr.io/sharad4/eks-platform/backend
  tag: "initial"      # replaced by CI after the first image build

# Nothing may connect to a worker (it has no port), even from the shared lite defaults.
networkPolicy:
  ingressFromNamespaces: []
