# Scrapes the External Secrets Operator so the ExternalSecretSyncFailing alert has data.
# VERIFY the selector after install:  kubectl -n external-secrets get svc --show-labels
# (service labels and the metrics port name can differ between chart versions).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: external-secrets
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames: [external-secrets]
  selector:
    matchLabels:
      app.kubernetes.io/name: external-secrets
  endpoints:
    - port: metrics
      interval: 60s
