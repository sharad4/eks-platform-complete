# Pull the platform secrets from AWS Secrets Manager (created once with
# scripts/create-platform-secrets.sh). Safe in Git: references only.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets-manager, kind: ClusterSecretStore }
  target: { name: grafana-admin, creationPolicy: Owner }
  dataFrom:
    - extract: { key: platform/grafana-admin }     # keys: admin-user, admin-password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: alertmanager-slack
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets-manager, kind: ClusterSecretStore }
  target: { name: alertmanager-slack, creationPolicy: Owner }
  data:
    - secretKey: url
      remoteRef: { key: platform/alertmanager-slack, property: url }
